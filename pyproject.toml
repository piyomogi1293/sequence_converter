[project]
name = "sequence-converter"
version = "0.1.0"
description = "PNG/JPG形式のシーケンス図画像をPlantUMLテキスト形式に変換するPythonツール"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "sequence-converter team" }
]
dependencies = [
    "opencv-python==4.12.0.88",
    "pytesseract==0.3.13",
    "pydantic==2.10.6",
    "typer==0.20.0",
    "rich==14.2.0",
    "numpy==2.2.6",
    "pillow==10.4.0",
    "annotated-types==0.7.0",
    "attrs==25.3.0",
    "black>=25.12.0",
    "cfgv==3.4.0",
    "click==8.1.8",
    "distlib==0.4.0",
    "filelock==3.16.1",
    "flake8>=7.3.0",
    "hypothesis==6.113.0",
    "identify==2.6.1",
    "iniconfig==2.1.0",
    "isort>=7.0.0",
    "markdown-it-py==3.0.0",
    "mccabe==0.7.0",
    "mdurl==0.1.2",
    "mypy-extensions==1.1.0",
    "nodeenv==1.9.1",
    "packaging==25.0",
    "pathspec==0.12.1",
    "platformdirs==4.3.6",
    "pluggy==1.5.0",
    "pre-commit>=4.5.0",
    "pycodestyle>=2.14.0",
    "pydantic-core==2.27.2",
    "pyflakes>=3.4.0",
    "pygments==2.19.2",
    "pytest>=9.0.2",
    "pyyaml==6.0.3",
    "shellingham==1.5.4",
    "sortedcontainers==2.4.0",
    "typing-extensions==4.13.2",
    "virtualenv==20.35.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "black>=25.12.0",
    "isort>=7.0.0",
    "flake8>=7.3.0",
    "pre-commit>=4.5.0",
]

[project.scripts]
sequence-converter = "sequence_converter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sequence_converter"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
# Disable assertion rewriting for troubleshooting
pythondontwritebytecode = true

[dependency-groups]
dev = [
    "black>=25.12.0",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
]
